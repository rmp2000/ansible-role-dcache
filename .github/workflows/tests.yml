name: dCache role tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dcache:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Ansible
        run: python -m pip install ansible==8.7.0
      - name: Install roles and collections
        run: ansible-galaxy install -r requirements.yml
      - name: Check playbook syntax
        run: ansible-playbook --syntax-check tests/install.yml
      - name: Install and test dCache
        run: ansible-playbook -i localhost, tests/install.yml
      - name: Repeat installation and assert idempotence
        run: |
          set -o pipefail
          ansible-playbook -i localhost, tests/install.yml | tee /tmp/dcache-repeat.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' /tmp/dcache-repeat.log
      - name: Show service logs on failure
        if: failure()
        run: sudo journalctl -u dcache@dCacheDomain --no-pager -n 120
